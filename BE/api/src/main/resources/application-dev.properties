spring.application.name=synapse-api
spring.jwt.secret=${SPRING_JWT_SECRET}

# =========================
# Kurento (disabled for local dev)
# =========================
kurento.enabled=false

# =========================
# DataSource (PostgreSQL)
# =========================
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${POSTGRES_DB_URL}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =========================
# Redis
# =========================
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=6379

# =========================
# MongoDB
# =========================
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=test_synapse
spring.data.mongodb.uuid-representation=standard

# =========================
# Google
# =========================
google.client.id=${GOOGLE_CLIENT_ID}
google.client.secret=${GOOGLE_CLIENT_SECRET}
google.redirect.uri=${GOOGLE_REDIRECT_URI}

google.web.redirect.uri=${GOOGLE_WEB_REDIRECT_URI}

# =========================
# Github
# =========================
github.client.id=${GITHUB_CLIENT_ID}
github.client.secret=${GITHUB_CLIENT_SECRET}
github.redirect.uri=${GITHUB_REDIRECT_URI}

github.web.client.id=${GITHUB_WEB_CLIENT_ID}
github.web.client.secret=${GITHUB_WEB_CLIENT_SECRET}
github.web.redirect.uri=${GITHUB_WEB_REDIRECT_URI}

# =========================
# AWS S3
# =========================
spring.cloud.aws.region.static=${AWS_REGION}
cloud.aws.s3.bucket=${S3_BUCKET}
cloud.aws.s3.image-prefix=dev/images
cloud.aws.s3.presign.put-exp-min=10
cloud.aws.s3.presign.get-exp-min=90

# =========================
# Invitation
# =========================
app.invitation.expiration-days=7
app.frontend.base-url=http://localhost:5173

# =========================
# AI (GMS API)
# =========================
ai.default.provider=OPENAI
ai.summary.provider=GEMINI
ai.code-review.provider=ANTHROPIC

# OpenAI (Legacy - 기존 호환성)
ai.gms.api.key=${GMS_KEY}
ai.gms.api.url=${GMS_URL}
ai.gms.model=gpt-4o-mini
ai.gms.temperature=0.7
ai.gms.max.tokens=2000

# Gemini (Google) - 노트 요약용
ai.gemini.api.key=${GMS_KEY}
ai.gemini.api.url=https://gms.ssafy.io/gmsapi/generativelanguage.googleapis.com/v1beta/models/{model}:generateContent
ai.gemini.model=gemini-2.5-flash

# Claude (Anthropic) - 코드 리뷰용
ai.claude.api.key=${GMS_KEY}
ai.claude.api.url=https://gms.ssafy.io/gmsapi/api.anthropic.com/v1/messages
ai.claude.model=claude-opus-4-5-20251101
ai.claude.max.tokens=4096
ai.claude.anthropic.version=2023-06-01
