# H2 In-Memory Database for Testing
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Embedded MongoDB (auto-configured by de.flapdoodle.embed.mongo)
# Spring Boot will automatically start embedded MongoDB when this dependency is present
# No explicit URI needed - it will use a random available port
spring.mongodb.embedded.version=7.0.2

# Redis - Connection will be attempted but failures won't prevent context loading
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=1s

# JWT (test secret)
spring.jwt.secret=test-jwt-secret-key-for-testing-minimum-256-bits-required-hs256

# OAuth2 - Google (test values)
google.client.id=test-google-client-id
google.client.secret=test-google-client-secret
google.redirect.uri=http://localhost:5173/auth/google/callback

# OAuth2 - GitHub (test values)
github.client.id=test-github-client-id
github.client.secret=test-github-client-secret
github.redirect.uri=http://localhost:5173/auth/github/callback

# Disable security for basic tests
# Security enabled with dummy values below

# Logging
logging.level.org.springframework=WARN
logging.level.com.synapse=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# =========================
# AWS S3
# =========================
spring.cloud.aws.region.static=test
cloud.aws.s3.bucket=test
cloud.aws.s3.image-prefix=test
cloud.aws.s3.presign.put-exp-min=10
cloud.aws.s3.presign.get-exp-min=10
