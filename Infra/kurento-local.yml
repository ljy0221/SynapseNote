version: '3.8'

services:
  kurento:
    image: kurento/kurento-media-server:latest
    container_name: synapse-kurento
    ports:
      - "8888:8888"
      - "5000-5050:5000-5050/udp"
    environment:
      - KMS_MIN_TCP_PORT=5000
      - KMS_MAX_TCP_PORT=5050
      - KMS_MIN_UDP_PORT=5000
      - KMS_MAX_UDP_PORT=5050
    restart: always
    network_mode: bridge
